  .sub{text-align:center;color:var(--muted);font-size:14px;font-weight:300;margin:0 0 16px;line-height:1.6}
  .searchbar{position:relative;max-width:560px;margin:0 auto}
  input[type=search]{width:100%;padding:15px 46px 15px 18px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none}
  input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbar .ico{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;pointer-events:none}
  .meta{max-width:560px;margin:10px auto 0;display:flex;justify-content:space-between;color:var(--muted);font-size:13px;min-height:18px}
  main{max-width:1080px;margin:22px auto 0;padding:0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;transition:transform .12s}

  .cap{padding:10px 10px 12px;text-align:center}
  .nm{font-family:'Frank Ruhl Libre',serif;font-size:15.5px;font-weight:500;line-height:1.35}
  .dt{color:var(--muted);font-size:12.5px;margin-top:4px;font-weight:300}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}
  footer{max-width:1080px;margin:44px auto 0;padding:18px 16px 0;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;font-weight:300}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3px 12px;font-size:12px;margin-bottom:8px}
</style></head>

const FINAL = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function norm(s){return (s||'').toString().replace(/[\u0591-\u05C7]/g,'').replace(/[\u05F3\u05F4"\u2018\u2019'`]/g,'').replace(/[ךםןףץ]/g,c=>FINAL[c]).replace(/\s+/g,' ').trim().toLowerCase();}
function cleanQuery(s){return norm(s).replace(/^לזכר\s+/,'').replace(/\s+זל$/,'');}
DATA.forEach(d=>{d._n=norm(d.name);d._c=norm(d.city);d._a=d.age?String(d.age):'';});
const q=document.getElementById('q'),grid=document.getElementById('grid'),empty=document.getElementById('empty'),count=document.getElementById('count'),hint=document.getElementById('hint');
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(t,query){const nq=cleanQuery(query);if(!nq)return esc(t);const i=norm(t).indexOf(nq);if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+nq.length))+'</mark>'+esc(t.slice(i+nq.length));}
function render(query){
  const nq=cleanQuery(query);
  const list=nq?DATA.filter(d=>d._n.includes(nq)||d._c.includes(nq)||d._a===nq||d._a.startsWith(nq)):DATA;
  grid.innerHTML=list.map(d=>`<a class="card" href="${d.url}">

}
q.addEventListener('input',e=>render(e.target.value));
