<style>
  :root{
    --bg:#faf7f1; --card:#ffffff; --ink:#26221c; --muted:#8a8175;
    --line:#eae2d5; --accent:#a8843f; --accent-soft:#f3ead7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;

  header{background:linear-gradient(180deg,#fffdf9,#faf7f1);border-bottom:1px solid var(--line);
         padding:22px 16px 16px;position:sticky;top:0;z-index:10}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:clamp(26px,7vw,40px);
     margin:0 0 4px;text-align:center;letter-spacing:-.5px}
  .candle{text-align:center;color:var(--accent);font-size:15px;letter-spacing:2px;margin-bottom:10px}
  .sub{text-align:center;color:var(--muted);font-size:14px;font-weight:300;margin:0 0 16px;line-height:1.6}
  .searchbar{position:relative;max-width:560px;margin:0 auto}
  input[type=search]{width:100%;padding:15px 46px 15px 18px;font-size:16px;font-family:inherit;
     border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
     box-shadow:0 1px 2px rgba(0,0,0,.03);outline:none}
  input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbar .ico{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);
     color:var(--muted);font-size:17px;pointer-events:none}
  .meta{max-width:560px;margin:10px auto 0;display:flex;justify-content:space-between;
        align-items:center;color:var(--muted);font-size:13px;min-height:18px}
  main{max-width:1080px;margin:22px auto 0;padding:0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column}
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f0ece4}
  .cap{padding:10px 10px 12px;text-align:center}
  .nm{font-family:'Frank Ruhl Libre',serif;font-size:16px;font-weight:500;line-height:1.3}
  .dt{color:var(--muted);font-size:12.5px;margin-top:3px;font-weight:300}
  mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}
  footer{max-width:1080px;margin:44px auto 0;padding:18px 16px 0;border-top:1px solid var(--line);
         text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;font-weight:300}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;
         padding:3px 12px;font-size:12px;margin-bottom:8px}
</style>

      <span class="ico">🔍</span>

    <div class="meta"><span id="count"></span><span id="hint"></span></div>
  </div>
</header>
<main>

const FINAL = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function norm(s){
  return (s||'').toString()
    .replace(/[\u0591-\u05C7]/g,'')
    .replace(/[\u05F3\u05F4"\u2018\u2019'`]/g,'')
    .replace(/[ךםןףץ]/g, c => FINAL[c])
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}
DATA.forEach(d => { d._n = norm(d.name); d._c = norm(d.city); d._a = d.age ? String(d.age) : ''; });

const q = document.getElementById('q');
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const hint = document.getElementById('hint');

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function highlight(text, query){
  const nq = norm(query);
  if(!nq) return esc(text);
  const idx = norm(text).indexOf(nq);
  if(idx < 0) return esc(text);
  return esc(text.slice(0, idx)) + '<mark>' + esc(text.slice(idx, idx + nq.length)) + '</mark>' + esc(text.slice(idx + nq.length));
}

function render(query){
  const nq = norm(query);
  const list = nq ? DATA.filter(d => d._n.includes(nq) || d._c.includes(nq) || d._a === nq || d._a.startsWith(nq)) : DATA;
  grid.innerHTML = list.map(d => `
    <div class="card">
      <img loading="lazy" src="${d.thumb}" alt="${esc(d.name)}">
      <div class="cap">
        <div class="nm">${highlight(d.name, query)}</div>
        <div class="dt">${d.age ? 'בן/בת ' + d.age + ' · ' : ''}${esc(d.city || '')}</div>
      </div>
    </div>`).join('');
  empty.style.display = list.length ? 'none' : 'block';
  count.textContent = nq ? `נמצאו ${list.length} מתוך ${DATA.length}` : `${DATA.length} ציורים בתצוגה`;
  hint.textContent = nq ? 'לחיצה על ✕ לניקוי' : '';
}

q.addEventListener('input', e => render(e.target.value));
render('');
</script>
